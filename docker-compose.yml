version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openbrain-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: openbrain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: openbrain
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openbrain"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: openbrain-mcp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:openbrain@postgres:5432/openbrain
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy